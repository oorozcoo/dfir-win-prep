network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:  # <-- Change this to your interface name
      dhcp4: no
      addresses:
        - 192.168.1.100/24  # <-- Your desired static IP and subnet mask
      routes:
        - to: default
          via: 192.168.1.1   # <-- Your router's gateway IP
      nameservers:
        addresses: # <-- DNS servers
